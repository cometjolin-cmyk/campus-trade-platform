services:
  - type: web
    name: campus-trade-platform
    env: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
